services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: medical_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Seteaza DB_PASSWORD inainte de pornire}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - medical_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medical_db"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  medical_data:
