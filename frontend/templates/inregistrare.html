<!doctype html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Înregistrare · Monitorizare medicală</title><link rel="stylesheet" href="/app.css"></head>
<body><main class="login card">
<p class="eyebrow">CONT NOU</p><h1>Înregistrare pacient</h1>
<p>Vei putea vedea propriile măsurători și programări. Un administrator îți va repartiza medicul responsabil.</p>
<form th:action="@{/inregistrare}" method="post" th:object="${cont}">
<div role="alert" th:if="${#fields.hasAnyErrors()}"><p th:each="err : ${#fields.allErrors()}" th:text="${err}"></p></div>
<label for="nume">Nume complet</label><input id="nume" th:field="*{nume}" maxlength="100" autocomplete="name" required>
<label for="username">Utilizator</label><input id="username" th:field="*{username}" minlength="3" maxlength="50" autocomplete="username" required>
<label for="parola">Parolă (minimum 12 caractere)</label><input type="password" id="parola" name="parola" minlength="12" maxlength="72" autocomplete="new-password" required>
<label for="confirmareParola">Confirmă parola</label><input type="password" id="confirmareParola" name="confirmareParola" autocomplete="new-password" required>
<button>Creează cont</button></form><p><a href="/login.html">Înapoi la autentificare</a></p>
</main></body></html>
