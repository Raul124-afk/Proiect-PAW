<!doctype html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Autentificare · Monitorizare medicală</title>
    <link rel="stylesheet" href="/app.css">
</head>
<body>
    <main class="login card">
        <p class="eyebrow">PROIECT EDUCAȚIONAL</p>
        <h1>Monitorizare medicală</h1>
        <p>Autentifică-te pentru a accesa contul tău.</p>

        <!-- Thymeleaf afișează mesajul potrivit, fără JavaScript suplimentar. -->
        <p role="alert" th:if="${param.error}">Utilizator sau parolă incorectă.</p>
        <p role="status" th:if="${param.logout}">Te-ai deconectat.</p>

        <p role="status" th:if="${param.inregistrat}">Contul a fost creat. Te poți autentifica.</p>

        <form action="/login" method="post">
            <label for="username">Utilizator</label>
            <input id="username" name="username" autocomplete="username" required autofocus>
            <label for="password">Parolă</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>

            <!-- Spring generează tokenul; Thymeleaf îl introduce în formular. -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button>Autentificare</button>
        </form>
        <p><a href="/inregistrare">Creează un cont de pacient</a></p>
    </main>
</body>
</html>
