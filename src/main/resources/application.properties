server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/medical_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.bootstrap.username=${APP_USERNAME:medic}
app.bootstrap.password=${APP_PASSWORD:}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.error.include-message=never

# Ca în laborator: JWT HS256, valabil o oră. Fără secret configurat, cheia este temporară.
app.jwt.secret=${JWT_SECRET:}
app.jwt.valabilitate=PT1H
